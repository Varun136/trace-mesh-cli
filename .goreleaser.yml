# GoReleaser v2 configuration. Release with: git tag vX.Y.Z && git push origin vX.Y.Z
version: 2

project_name: tracemesh

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/tm
    binary: tm
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ldflags:
      - -s -w -X tracemesh/cmd.version={{.Version}} -X tracemesh/cmd.commit={{.ShortCommit}} -X tracemesh/cmd.date={{.Date}}

archives:
  - formats: ["tar.gz"]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

# Published (non-draft) releases are required so users can install pre-built
# binaries without Go (see install.sh, which resolves the latest release).
release:
  github:
    owner: Varun136
    name: trace-mesh-cli
  draft: false
  prerelease: auto
